name: build-site
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'articles.json'
      - 'thumbs/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: |
          git config user.name "site-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "auto: update sitemap and thumbnails" && git push)
