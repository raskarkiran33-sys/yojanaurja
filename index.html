body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}

.card h3{font-size:19px;margin-bottom:8px}

.search{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:#102622;color:white;margin:15px 0 22px;font-size:15px;outline:none}

footer p,footer a{color:var(--muted);font-size:13px}
footer h3{margin-bottom:12px}
footer a{display:block;margin:7px 0}

.copyright{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:750px){
.hero-grid{grid-template-columns:1fr}

.footer-grid{grid-template-columns:1fr}
nav{display:none;position:absolute;top:65px;left:0;width:100%;background:#071a18;padding:20px;flex-direction:column}
nav.open{display:flex}
.menu{display:block}
.hero{padding-top:40px}
.hero-img{height:230px}
